# wl-mx-gesture configuration.
# Copy to ~/.config/wl-mx-gesture/config.toml; this built-in copy is used when that file is missing.
#
# Distances are raw mouse units (roughly sensor counts), durations are milliseconds.
# Actions, translated for the running compositor (legacy and Lua Hyprland are auto-detected):
#   { workspace = "3" | "e+1" | "name" }   { move_to_workspace = "…" }   { toggle_special = "name" }
#   { adjacent_workspace = "left" | "right" }   { move_to_adjacent_workspace = "left" | "right" }
#   "close_window"   "toggle_floating"   "fullscreen"   "maximize"
#   { exec = "shell command" }
#   { hyprland = "…" } raw dispatch sent verbatim, in the syntax of your Hyprland version
#
# `double_tap` and `hold` take an action or `{ wheel = "name" }`. A double-tap wheel opens on the
# second press and runs the slot you point at when you release; movement between the taps is ignored.
# Hold still `hold_ms` to fire `hold`; move past `swipe_threshold` while pressed to swipe.

[gesture]
swipe_threshold = 60
dead_zone = 40
hold_ms = 700
double_tap_ms = 250

# How `adjacent_workspace` and `move_to_adjacent_workspace` pick the next workspace with several monitors:
#   "monitor"  workspaces of the focused monitor only, wrapping around (like Hyprland's m+1)
#   "spatial"  workspaces of the focused monitor by number; past its last (or first) one, the active workspace
#              of the nearest monitor on that side, monitors being placed by their position in the layout.
#              Stops at the outermost monitor.
#   "global"   every workspace by number, whatever its monitor, wrapping around (like Hyprland's e+1)
[workspaces]
navigation = "monitor"

[bindings]
# tap = { exec = "fuzzel" }
double_tap = { wheel = "main" }
# hold = "toggle_floating"

[bindings.swipe]
left = { adjacent_workspace = "left" }
right = { adjacent_workspace = "right" }
up = "maximize"
down = { toggle_special = "magic" }

# Slots are laid out clockwise, the first one at the top.
[[wheel.main.slots]]
label = "Close"
icon = "window-close"
action = "close_window"

[[wheel.main.slots]]
label = "Move →"
icon = "go-next"
action = { move_to_adjacent_workspace = "right" }

[[wheel.main.slots]]
label = "Float"
icon = "window-restore"
action = "toggle_floating"

[[wheel.main.slots]]
label = "Fullscreen"
icon = "view-fullscreen"
action = "fullscreen"

[[wheel.main.slots]]
label = "Scratchpad"
icon = "view-grid"
action = { move_to_workspace = "special:magic" }

[[wheel.main.slots]]
label = "Move ←"
icon = "go-previous"
action = { move_to_adjacent_workspace = "left" }

# Look of the wheel; sizes are logical pixels, colours #rrggbb or #rrggbbaa.
[style]
outer_radius = 150
inner_radius = 50
background = "#1e1e2ee6"
highlight = "#89b4fa"
text = "#cdd6f4"
highlighted_text = "#1e1e2e"
# font = "Inter"
font_size = 14
icon_size = 32
# icon_theme = "Papirus-Dark"
tint_icons = true
